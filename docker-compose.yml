version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipforge-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_ANALYSIS_MODEL=gemini-3.8-flash
      - GEMINI_TRANSCRIPTION_MODEL=gemini-3.5-transcribe
      - DATABASE_URL=sqlite+aiosqlite:////app/storage/clipforge.db
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: clipforge-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - backend
    restart: unless-stopped
